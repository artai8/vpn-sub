name: check-nodes

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'check.py'
      - '.github/workflows/check.yml'

permissions:
  contents: write

concurrency:
  group: check-nodes
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download source lists (igareck, latest)
        run: |
          mkdir -p src
          base=https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main
          curl -fsSL "$base/BLACK_VLESS_RUS.txt" -o src/BLACK_VLESS_RUS.txt
          curl -fsSL "$base/BLACK_VLESS_RUS_mobile.txt" -o src/BLACK_VLESS_RUS_mobile.txt
          curl -fsSL "$base/BLACK_SS%2BAll_RUS.txt" -o "src/BLACK_SS+All_RUS.txt"
          wc -l src/*.txt

      - name: Install Python deps
        run: pip install pyyaml

      - name: Run checker
        run: python3 check.py --src src/BLACK_VLESS_RUS.txt src/BLACK_VLESS_RUS_mobile.txt "src/BLACK_SS+All_RUS.txt" --concurrency 48

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -s output/sub.txt ]; then
            echo "sub.txt empty or missing - keeping previous results, nothing to commit."
            exit 0
          fi
          git add output/
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "update subscription $(date -u +%Y-%m-%dT%H:%MZ)"
          # 推送可能因运行期间 main 被其他提交推进而被拒（non-fast-forward）：
          # 把本轮 output/ 成果以软重置方式重放到最新 main 上重试，避免整轮结果丢失。
          for i in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $i"
              break
            fi
            echo "push rejected (attempt $i) - replaying outputs onto latest main"
            git fetch origin main
            git reset --soft origin/main
            git add output/
            git commit -m "update subscription $(date -u +%Y-%m-%dT%H:%MZ)" || true
            sleep 5
          done
          git log --oneline -1
